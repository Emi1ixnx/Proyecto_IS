{% extends "base.html" %}
{% block titulo %}Pasar lista{% endblock %}

{% block contenido %}
<h1 class="h3 mb-3">Pasar lista</h1>
{% if not materias %}
  <div class="alert alert-warning">
    Primero registra una materia en <a href="/materias" class="alert-link">Materias</a>
    y captura sus alumnos.
  </div>
{% else %}
<form method="post" action="/pasar-lista" class="card card-body mb-4">
  <div class="row g-3">
    <div class="col-md-6">
      <label for="id_materia" class="form-label">Materia</label>
      <select class="form-select" id="id_materia" name="id_materia" required>
        <option value="">Selecciona una materia…</option>
        {% for m in materias %}
          <option value="{{ m.id_materia }}" {% if id_materia|string == m.id_materia|string %}selected{% endif %}>{{ m.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label for="fecha" class="form-label">Fecha de la clase</label>
      <input type="date" class="form-control{{ ' is-invalid' if error else '' }}" id="fecha" name="fecha"
             value="{{ fecha }}" required>
    </div>
    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-primary w-100">Continuar</button>
    </div>
  </div>
</form>
{% endif %}
{% endblock %}
